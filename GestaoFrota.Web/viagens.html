<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viagens — Gestão de Frota</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="app">

    <aside class="lateral"></aside>

    <main class="conteudo">

      <header class="topo">
        <div>
          <h1 class="titulo-pagina">Viagens</h1>
          <p class="subtitulo">Viagens abertas e encerradas. Abrir e encerrar (inclusive sem internet) é pelo aplicativo.</p>
        </div>
      </header>

      <div class="segmentos" role="group" aria-label="Filtrar por situação">
        <button class="segmento ativo" data-status="todas">Todas</button>
        <button class="segmento" data-status="1">Em andamento</button>
        <button class="segmento" data-status="2">Concluídas</button>
        <button class="segmento" data-status="3">Canceladas</button>
      </div>

      <div id="aviso" class="aviso" hidden></div>

      <section class="cartao">
        <ul class="lista" id="lista"></ul>
      </section>

    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/api.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/viagens.js"></script>
</body>
</html>
