<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movimentações — FrotaFin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="app">

    <aside class="lateral"></aside>

    <main class="conteudo">

      <header class="topo">
        <div>
          <h1 class="titulo-pagina">Movimentações</h1>
          <p class="subtitulo">Receitas e despesas lançadas. Para lançar, pagar ou estornar, use o aplicativo.</p>
        </div>
      </header>

      <div class="segmentos" role="group" aria-label="Filtrar">
        <button class="segmento ativo" data-filtro="todas">Todas</button>
        <button class="segmento" data-filtro="pendentes">Pendentes</button>
        <button class="segmento" data-filtro="pagas">Pagas</button>
      </div>

      <label class="linha-interruptor">
        <input type="checkbox" id="mostrar-estornadas">
        <span>Mostrar estornadas</span>
      </label>

      <div id="aviso" class="aviso" hidden></div>

      <section class="cartao">
        <ul class="lista" id="lista"></ul>
      </section>

    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/api.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/movimentacoes.js"></script>
</body>
</html>
