<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — FrotaFin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pagina-login">

  <main class="cartao-login">
    <div class="login-marca">
      <img src="img/logo-frotafin.svg" alt="" width="56" height="56">
    </div>

    <h1 class="wordmark">Frota<span class="marca-fin">Fin</span></h1>
    <p id="texto-login">Sistema de gestão financeira e controle de frota.</p>

    <div id="aviso" class="aviso aviso-erro" hidden></div>

    <!-- Entrar com e-mail e senha (conta criada pelo Administrador) -->
    <form class="form-login" id="form-senha" novalidate>
      <label class="campo">
        <span>E-mail</span>
        <input type="email" id="campo-email" autocomplete="username" required>
      </label>
      <label class="campo">
        <span>Senha</span>
        <input type="password" id="campo-senha" autocomplete="current-password" required>
      </label>
      <button type="submit" class="botao botao-cheio botao-largo" id="botao-entrar">Entrar</button>
    </form>

    <div class="separador-login" id="separador-google"><span>ou</span></div>

    <div class="area-botao-google" id="botao-google"></div>

    <p class="nota-login" id="nota-google">
      Pelo Google, usamos sua conta apenas para identificar você. Não temos acesso à senha dela.
    </p>

    <div id="area-perfis"></div>

    <p class="nota-login">
      Também disponível como aplicativo Android. ·
      <a href="ajuda.html">Central de Ajuda</a> ·
      <a href="privacidade.html">Política de privacidade</a>
    </p>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/config.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/api.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
